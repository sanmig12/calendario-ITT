
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión | Plataforma Educativa</title>

    <link rel="stylesheet" href="login.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body>

    <main class="login-container">

        <section class="login-header">
            <div class="logo">
                <i class="fa-solid fa-graduation-cap"></i>
            </div>

            <h1>Bienvenido</h1>
            <p>Plataforma de cuestionarios educativos</p>
        </section>

        <section class="login-card">

            <div id="selectorAcceso" class="selector-acceso">
                <h2>¿Cómo deseas ingresar?</h2>
                <p>Selecciona el tipo de acceso que te corresponde.</p>

                <div class="opciones-acceso">

                    <button type="button" class="opcion-acceso"
                            id="btnProfesor">
                        <i class="fa-solid fa-chalkboard-user"></i>
                        <span>Profesor</span>
                        <small>Ingresar con correo y contraseña</small>
                    </button>

                    <button type="button" class="opcion-acceso"
                            id="btnAlumno">
                        <i class="fa-solid fa-user-graduate"></i>
                        <span>Alumno</span>
                        <small>Ingresar con matrícula y contraseña</small>
                    </button>

                </div>
            </div>

            <!-- ACCESO DEL PROFESOR -->
            <form id="formProfesor" class="form-login oculto">

                <button type="button" class="volver" id="volverProfesor">
                    <i class="fa-solid fa-arrow-left"></i> Volver
                </button>

                <div class="form-icon">
                    <i class="fa-solid fa-chalkboard-user"></i>
                </div>

                <h2>Acceso de profesor</h2>
                <p>Ingresa con tu cuenta de profesor.</p>

                <label for="correoProfesor">Correo electrónico</label>
                <div class="input-group">
                    <i class="fa-solid fa-envelope"></i>
                    <input type="email" id="correoProfesor"
                           placeholder="correo@ejemplo.com" required>
                </div>

                <label for="passwordProfesor">Contraseña</label>
                <div class="input-group">
                    <i class="fa-solid fa-lock"></i>
                    <input type="password" id="passwordProfesor"
                           placeholder="Ingresa tu contraseña" required>
                </div>

                <button type="submit" class="btn-ingresar">
                    Iniciar sesión
                </button>

            </form>

            <!-- ACCESO DEL ALUMNO -->
            <form id="formAlumno" class="form-login oculto">

                <button type="button" class="volver" id="volverAlumno">
                    <i class="fa-solid fa-arrow-left"></i> Volver
                </button>

                <div class="form-icon">
                    <i class="fa-solid fa-user-graduate"></i>
                </div>

                <h2>Acceso de alumno</h2>
                <p>Ingresa tus datos para continuar.</p>

                <label for="matriculaAlumno">Matrícula</label>
                <div class="input-group">
                    <i class="fa-solid fa-id-card"></i>
                    <input type="text" id="matriculaAlumno"
                           placeholder="Ingresa tu matrícula" required>
                </div>

                <label for="passwordAlumno">Contraseña de la clase</label>
                <div class="input-group">
                    <i class="fa-solid fa-lock"></i>
                    <input type="password" id="passwordAlumno"
                           placeholder="Ingresa la contraseña" required>
                </div>

                <label for="codigoClase">Código de clase</label>
                <div class="input-group">
                    <i class="fa-solid fa-users"></i>
                    <input type="text" id="codigoClase"
                           placeholder="Código proporcionado por tu profesor"
                           required>
                </div>

                <button type="submit" class="btn-ingresar">
                    Iniciar sesión
                </button>

            </form>

            <div id="mensajeLogin" class="mensaje-login" role="status"></div>

        </section>

        <footer>
            <p>Plataforma Educativa · Cuestionarios interactivos</p>
        </footer>

    </main>

    <script type="module" src="login.js"></script>

</body>
</html>
